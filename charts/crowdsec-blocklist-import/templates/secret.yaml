{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crowdsec-blocklist-import.fullname" . }}
  labels:
    {{- include "crowdsec-blocklist-import.labels" . | nindent 4 }}
type: Opaque
stringData:
  CROWDSEC_LAPI_KEY: {{ required "secrets.crowdsecLapiKey is required (or point existingSecret at a Secret you manage)" .Values.secrets.crowdsecLapiKey | quote }}
  {{- with .Values.secrets.abuseipdbApiKey }}
  ABUSEIPDB_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.webhookUrl }}
  WEBHOOK_URL: {{ . | quote }}
  {{- end }}
{{- end }}
