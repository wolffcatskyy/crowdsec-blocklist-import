name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Run pytest
        run: |
          python -m pytest test_blocklist_import.py test_feed_health_coverage.py -v

      - name: Check Python syntax
        run: |
          python -m py_compile blocklist_import.py

      - name: Lint with flake8
        run: |
          flake8 blocklist_import.py --max-line-length 120 --ignore E501,W503

  live-lapi:
    name: Live LAPI round-trip (structured scenarios)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start CrowdSec LAPI (no upstream API, no console enrollment)
        run: |
          docker run -d --name crowdsec -p 8080:8080 \
            -e DISABLE_ONLINE_API=true \
            -e CROWDSEC_BYPASS_DB_VOLUME_CHECK=true \
            crowdsecurity/crowdsec:v1.8.1
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/decisions || true)
            if [ "$code" != "000" ]; then echo "LAPI up (HTTP $code)"; break; fi
            sleep 2
          done
          [ "$code" != "000" ] || { docker logs crowdsec; exit 1; }
          docker exec crowdsec cscli machines add ci-importer --password ci-importer-pass --force
          docker exec crowdsec cscli machines validate ci-importer || true

      - name: Serve test feeds
        run: |
          python3 -m http.server 8899 --directory tests/fixtures &
          sleep 1
          curl -sf http://localhost:8899/feed-low.txt
          curl -sf http://localhost:8899/feed-high.txt

      - name: Run importer against the live LAPI (structured, per-feed alerts)
        env:
          CROWDSEC_LAPI_URL: http://localhost:8080
          CROWDSEC_MACHINE_ID: ci-importer
          CROWDSEC_MACHINE_PASSWORD: ci-importer-pass
          SCENARIO_FORMAT: structured
          BLOCKLISTS_OPT_IN: "true"
          CUSTOM_BLOCKLISTS: http://localhost:8899/feed-low.txt,http://localhost:8899/feed-high.txt
          FEED_CONFIDENCE: custom-blocklist-0=30,custom-blocklist-1=95
          TELEMETRY_ENABLED: "false"
          METRICS_ENABLED: "false"
          CROWDSEC_HEARTBEAT_INTERVAL: "0"
        run: python3 blocklist_import.py

      - name: Assert scenarios round-trip byte-for-byte and multi-feed IPs get the highest confidence
        run: |
          docker exec crowdsec cscli decisions list -o json > decisions.json
          python3 tests/assert_live_lapi.py decisions.json

      - name: Restart with a fresh LAPI for the consolidation run
        run: |
          docker rm -f crowdsec
          docker run -d --name crowdsec -p 8080:8080 \
            -e DISABLE_ONLINE_API=true \
            -e CROWDSEC_BYPASS_DB_VOLUME_CHECK=true \
            crowdsecurity/crowdsec:v1.8.1
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/decisions || true)
            if [ "$code" != "000" ]; then echo "LAPI up (HTTP $code)"; break; fi
            sleep 2
          done
          [ "$code" != "000" ] || { docker logs crowdsec; exit 1; }
          docker exec crowdsec cscli machines add ci-importer --password ci-importer-pass --force
          docker exec crowdsec cscli machines validate ci-importer || true

      - name: Run importer with CONSOLIDATE_ALERTS=true
        env:
          CROWDSEC_LAPI_URL: http://localhost:8080
          CROWDSEC_MACHINE_ID: ci-importer
          CROWDSEC_MACHINE_PASSWORD: ci-importer-pass
          SCENARIO_FORMAT: structured
          CONSOLIDATE_ALERTS: "true"
          BLOCKLISTS_OPT_IN: "true"
          CUSTOM_BLOCKLISTS: http://localhost:8899/feed-low.txt,http://localhost:8899/feed-high.txt
          FEED_CONFIDENCE: custom-blocklist-0=30,custom-blocklist-1=95
          TELEMETRY_ENABLED: "false"
          METRICS_ENABLED: "false"
          CROWDSEC_HEARTBEAT_INTERVAL: "0"
        run: python3 blocklist_import.py

      - name: Assert consolidation stays per-feed (no all-sources)
        run: |
          docker exec crowdsec cscli alerts list -o json > alerts.json
          python3 tests/assert_live_lapi.py alerts.json --consolidated

      - name: Assert Central API is disabled (imported alerts cannot leak upstream)
        run: |
          oc=$(docker exec crowdsec cscli config show --key Config.API.Server.OnlineClient)
          [ "$oc" = "nil" ] || { echo "online_client configured: $oc"; exit 1; }
          if out=$(docker exec crowdsec cscli capi status 2>&1); then
            echo "CAPI unexpectedly configured: $out"; exit 1
          fi
          echo "$out" | grep -q "no configuration for Central API" || { echo "unexpected: $out"; exit 1; }
          docker exec crowdsec sh -c 'test ! -s /etc/crowdsec/online_api_credentials.yaml'

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          if [ -f CHANGELOG.md ]; then
            # Extract the section between this tag and the previous one
            NOTES=$(awk "/^## \[?${VER}\]?|^## ${VER}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              NOTES="Release ${TAG}"
            fi
          else
            NOTES="Release ${TAG}"
          fi
          # Write to a file to safely handle multi-line content
          echo "$NOTES" > release_notes.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # A release may already exist when a maintainer publishes it before the
          # tag-triggered workflow starts. Update it in that case so reruns and
          # manual releases are idempotent instead of failing with "already_exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Release $TAG" \
              --notes-file release_notes.txt
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file release_notes.txt
          fi
